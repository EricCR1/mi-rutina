<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<title>Mi Rutina</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f14;
    --bg2: #18181f;
    --bg3: #22222c;
    --accent: #e8f442;
    --accent2: #a3e635;
    --text: #f0f0f5;
    --muted: #888899;
    --border: rgba(255,255,255,0.08);
    --card: #1c1c25;
    --radius: 14px;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  /* HEADER */
  .header {
    padding: 52px 20px 16px;
    background: var(--bg);
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .day-label {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .day-title {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .day-subtitle {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* NUTRITION PILL (corner widget) */
  .nutrition-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .nutrition-btn:active { transform: scale(0.96); }

  .nutrition-btn .kcal {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .nutrition-btn .kcal-label {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
  }

  /* DAY TABS */
  .tabs-wrap {
    padding: 0 20px 16px;
    flex-shrink: 0;
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 50px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--accent);
    color: #0f0f14;
    border-color: var(--accent);
  }

  .tab.rest {
    font-style: italic;
  }

  /* EXERCISE LIST */
  .exercises {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 100px;
    scrollbar-width: none;
  }

  .exercises::-webkit-scrollbar { display: none; }

  .exercise-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ex-num {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
  }

  .ex-info { flex: 1; }

  .ex-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 1.1;
  }

  .ex-sets {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 400;
  }

  .ex-check {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .ex-check.done {
    background: var(--accent);
    border-color: var(--accent);
  }

  .ex-check svg { opacity: 0; transition: opacity 0.2s; }
  .ex-check.done svg { opacity: 1; }

  /* TIMER */
  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 14px 36px;
    border-bottom: 1px solid var(--border);
    margin-top: -1px;
  }

  .timer-ring-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .timer-ring-wrap svg {
    transform: rotate(-90deg);
  }

  .timer-ring-bg {
    fill: none;
    stroke: var(--bg3);
    stroke-width: 3;
  }

  .timer-ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 113;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }

  .timer-ring-fill.warning { stroke: #fb923c; }
  .timer-ring-fill.urgent  { stroke: #f87171; }

  .timer-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .timer-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .timer-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 14px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .timer-btn:active { transform: scale(0.94); }

  .timer-btn.primary {
    background: var(--accent);
    color: #0f0f14;
    border-color: var(--accent);
  }

  .timer-label {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }

  .timer-done-msg {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    padding: 0 20px 12px;
    flex-shrink: 0;
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }

  .progress-track {
    height: 4px;
    background: var(--bg3);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* NUTRITION PANEL (bottom sheet) */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.open { opacity: 1; pointer-events: all; }

  .nutrition-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 430px;
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    z-index: 11;
    padding: 20px 24px 48px;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .nutrition-panel.open {
    transform: translateX(-50%) translateY(0%);
  }

  .panel-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin: 0 auto 24px;
  }

  .panel-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .panel-subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .macro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .macro-card {
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid var(--border);
  }

  .macro-card.big {
    grid-column: span 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: var(--accent);
  }

  .macro-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .macro-card.big .macro-label { color: #0f0f14bb; }

  .macro-value {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 900;
    line-height: 1;
  }

  .macro-card.big .macro-value { color: #0f0f14; font-size: 38px; }

  .macro-unit {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 2px;
  }

  .macro-card.big .macro-unit { color: #0f0f14bb; }

  .macro-bar {
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    margin-top: 10px;
    overflow: hidden;
  }

  .macro-bar-fill {
    height: 100%;
    border-radius: 99px;
  }

  /* REST DAY */
  .rest-day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .rest-icon {
    font-size: 64px;
    margin-bottom: 20px;
    line-height: 1;
  }

  .rest-title {
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .rest-sub {
    font-size: 15px;
    color: var(--muted);
    max-width: 250px;
    line-height: 1.5;
  }

  /* DONE BANNER */
  .done-banner {
    display: none;
    text-align: center;
    padding: 16px 0 0;
  }

  .done-banner.show { display: block; }

  .done-text {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="day-label" id="day-label">Hoy</div>
        <div class="day-title" id="day-title">LUNES</div>
        <div class="day-subtitle" id="day-subtitle">Espalda + Pecho</div>
      </div>
      <button class="nutrition-btn" onclick="openNutrition()" aria-label="Ver macros">
        <div>
          <div class="kcal">2400</div>
          <div class="kcal-label">kcal</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="color:var(--muted)">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-label">
      <span id="progress-text">Progreso</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="exercises" id="exercises-list"></div>
</div>

<!-- Nutrition overlay -->
<div class="overlay" id="overlay" onclick="closeNutrition()"></div>

<div class="nutrition-panel" id="nutrition-panel">
  <div class="panel-handle"></div>
  <div class="panel-title">Macros Diarios</div>
  <div class="panel-subtitle">Objetivos nutricionales para todos los días</div>

  <div class="macro-grid">
    <div class="macro-card big">
      <div>
        <div class="macro-label">Calorías</div>
        <div class="macro-value">2400 <span class="macro-unit">kcal</span></div>
      </div>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" style="opacity:0.4">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor" style="color:#0f0f14"/>
      </svg>
    </div>

    <div class="macro-card">
      <div class="macro-label">Proteína</div>
      <div class="macro-value">190 <span class="macro-unit">g</span></div>
      <div class="macro-bar">
        <div class="macro-bar-fill" style="width:73%; background:#a3e635;"></div>
      </div>
    </div>

    <div class="macro-card">
      <div class="macro-label">Carbohidratos</div>
      <div class="macro-value">250 <span class="macro-unit">g</span></div>
      <div class="macro-bar">
        <div class="macro-bar-fill" style="width:96%; background:#60a5fa;"></div>
      </div>
    </div>

    <div class="macro-card" style="grid-column: span 2;">
      <div class="macro-label">Grasas</div>
      <div class="macro-value">70 <span class="macro-unit">g</span></div>
      <div class="macro-bar">
        <div class="macro-bar-fill" style="width:27%; background:#fb923c;"></div>
      </div>
    </div>
  </div>
</div>

<script>
const DAYS = [
  {
    short: 'LUN',
    name: 'Lunes',
    focus: 'Espalda + Pecho',
    exercises: [
      { name: 'Dominadas', sets: '4 series', note: 'Menos de 4 reps → negativas · Más de 4 → normales' },
      { name: 'Remo con mancuerna', sets: '4×8-12' },
      { name: 'Pullover con mancuerna', sets: '3×10-15' },
      { name: 'Press de pecho en suelo', sets: '4×8-12' },
      { name: 'Flexiones', sets: '3 series', note: 'Deja 1-2 reps en reserva' },
    ]
  },
  {
    short: 'MAR',
    name: 'Martes',
    focus: 'Brazo + Hombro',
    exercises: [
      { name: 'Curl alterno', sets: '4×8-12', group: 'Bíceps' },
      { name: 'Curl martillo', sets: '3×8-12', group: 'Bíceps' },
      { name: 'Press cerrado en suelo', sets: '4×8-12', group: 'Tríceps' },
      { name: 'Extensión sobre la cabeza', sets: '4×10-12', group: 'Tríceps' },
      { name: 'Press militar', sets: '4×8-12', group: 'Hombro' },
      { name: 'Elevaciones laterales', sets: '5×12-20', group: 'Hombro' },
      { name: 'Pájaros', sets: '3×12-20', group: 'Hombro' },
    ]
  },
  {
    short: 'MIÉ',
    name: 'Miércoles',
    focus: 'Pierna',
    exercises: [
      { name: 'Sentadilla búlgara', sets: '4×8-12' },
      { name: 'Peso muerto rumano', sets: '4×8-12' },
      { name: 'Sentadilla goblet', sets: '3×12-15' },
      { name: 'Pantorrillas', sets: '5×15-25' },
    ]
  },
  {
    short: 'JUE',
    name: 'Jueves',
    focus: 'Hombro + Tríceps + Pecho',
    exercises: [
      { name: 'Press militar', sets: '4×8-12', group: 'Hombro' },
      { name: 'Elevaciones laterales', sets: '5×12-20', group: 'Hombro' },
      { name: 'Pájaros', sets: '3×12-20', group: 'Hombro' },
      { name: 'Press de pecho en suelo', sets: '4×8-12', group: 'Pecho' },
      { name: 'Flexiones con pies elevados', sets: '3 series', note: '1-2 reps antes del fallo', group: 'Pecho' },
      { name: 'Press cerrado en suelo', sets: '4×8-12', group: 'Tríceps' },
      { name: 'Extensión sobre la cabeza', sets: '3×10-12', group: 'Tríceps' },
    ]
  },
  {
    short: 'VIE',
    name: 'Viernes',
    focus: 'Espalda + Bíceps',
    exercises: [
      { name: 'Dominadas', sets: '4 series', note: 'Misma regla del lunes' },
      { name: 'Remo con mancuerna', sets: '4×8-12' },
      { name: 'Pullover', sets: '3×10-15' },
      { name: 'Curl alterno', sets: '4×8-12', group: 'Bíceps' },
      { name: 'Curl martillo', sets: '3×8-12', group: 'Bíceps' },
      { name: 'Curl concentrado', sets: '3×10-12', group: 'Bíceps' },
    ]
  },
  {
    short: 'SÁB',
    name: 'Sábado',
    focus: 'Pierna',
    exercises: [
      { name: 'Peso muerto rumano', sets: '4×8-12' },
      { name: 'Sentadilla búlgara', sets: '4×8-12' },
      { name: 'Sentadilla goblet', sets: '3×12-15' },
      { name: 'Pantorrillas', sets: '5×15-25' },
    ]
  },
  {
    short: 'DOM',
    name: 'Domingo',
    focus: 'Descanso',
    rest: true,
    exercises: []
  }
];

// State: checked exercises per day
let checked = {};
DAYS.forEach((d, i) => { checked[i] = []; });

let currentDay = new Date().getDay(); // 0=Sun,1=Mon...
// Map to our index: Mon=0, Tue=1, ... Sun=6
const dayMap = [6, 0, 1, 2, 3, 4, 5];
let selectedDay = dayMap[currentDay];

function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  DAYS.forEach((d, i) => {
    const t = document.createElement('button');
    t.className = 'tab' + (d.rest ? ' rest' : '') + (i === selectedDay ? ' active' : '');
    t.textContent = d.short;
    t.onclick = () => selectDay(i);
    tabs.appendChild(t);
  });
  // Scroll active into view
  setTimeout(() => {
    const activeTab = tabs.querySelector('.active');
    if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 50);
}

function selectDay(i) {
  // Stop all running timers
  Object.values(timers).forEach(t => { if (t.interval) clearInterval(t.interval); });
  timers = {};
  selectedDay = i;
  buildTabs();
  renderDay();
}

function renderDay() {
  const day = DAYS[selectedDay];
  const isToday = selectedDay === dayMap[new Date().getDay()];

  document.getElementById('day-label').textContent = isToday ? 'Hoy' : day.name;
  document.getElementById('day-title').textContent = day.name.toUpperCase();
  document.getElementById('day-subtitle').textContent = day.focus;

  const list = document.getElementById('exercises-list');
  list.innerHTML = '';

  if (day.rest) {
    list.innerHTML = `
      <div class="rest-day">
        <div class="rest-icon">😴</div>
        <div class="rest-title">Descanso</div>
        <div class="rest-sub">Hoy toca recuperar. Come bien, hidratate y duerme suficiente.</div>
      </div>`;
    document.getElementById('progress-text').textContent = '';
    document.getElementById('progress-count').textContent = '';
    document.getElementById('progress-fill').style.width = '0%';
    return;
  }

  let lastGroup = null;

  day.exercises.forEach((ex, idx) => {
    const done = checked[selectedDay].includes(idx);

    // Group header (Bíceps / Tríceps / Hombro / etc.)
    if (ex.group && ex.group !== lastGroup) {
      lastGroup = ex.group;
      const groupEl = document.createElement('div');
      groupEl.style.cssText = 'padding: 14px 0 6px 36px; font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); opacity: 0.7;';
      groupEl.textContent = ex.group;
      list.appendChild(groupEl);
    }

    // Exercise card
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.style.animationDelay = `${idx * 40}ms`;
    card.style.borderBottom = 'none';
    card.innerHTML = `
      <div class="ex-num">${idx + 1}</div>
      <div class="ex-info">
        <div class="ex-name" style="${done ? 'text-decoration:line-through;opacity:0.45;' : ''}">${ex.name}</div>
        <div class="ex-sets">${ex.sets}</div>
        ${ex.note ? `<div style="font-size:11px;color:var(--accent);opacity:0.8;margin-top:3px;">⚡ ${ex.note}</div>` : ''}
      </div>
      <button class="ex-check ${done ? 'done' : ''}" onclick="toggleEx(${idx})" aria-label="Marcar como hecho">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3 8l3.5 3.5L13 5" stroke="#0f0f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>`;
    list.appendChild(card);

    // Timer row
    const timerRow = document.createElement('div');
    timerRow.className = 'timer-row';
    timerRow.id = `timer-row-${idx}`;
    timerRow.innerHTML = `
      <div class="timer-ring-wrap">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle class="timer-ring-bg" cx="22" cy="22" r="18"/>
          <circle class="timer-ring-fill" id="ring-${idx}" cx="22" cy="22" r="18"/>
        </svg>
        <div class="timer-num" id="tnum-${idx}">2:00</div>
      </div>
      <div class="timer-controls">
        <span class="timer-label" id="tlabel-${idx}">Descanso</span>
        <button class="timer-btn primary" id="tbtn-${idx}" onclick="timerAction(${idx})">Iniciar</button>
        <button class="timer-btn" onclick="timerReset(${idx})">↺</button>
      </div>`;
    list.appendChild(timerRow);
  });

  updateProgress();
}

function toggleEx(idx) {
  const arr = checked[selectedDay];
  const pos = arr.indexOf(idx);
  if (pos === -1) arr.push(idx);
  else arr.splice(pos, 1);
  renderDay();
}

function updateProgress() {
  const day = DAYS[selectedDay];
  if (day.rest || day.exercises.length === 0) return;
  const total = day.exercises.length;
  const done = checked[selectedDay].length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
  document.getElementById('progress-text').textContent = pct === 100 ? '¡Rutina completada! 🏆' : 'Ejercicios';
}

// TIMER STATE
const TIMER_DURATION = 120; // 2 minutes
let timers = {}; // { idx: { remaining, interval, running } }

function getTimer(idx) {
  if (!timers[idx]) timers[idx] = { remaining: TIMER_DURATION, interval: null, running: false };
  return timers[idx];
}

function timerAction(idx) {
  const t = getTimer(idx);
  if (t.running) {
    // Pause
    clearInterval(t.interval);
    t.running = false;
    document.getElementById(`tbtn-${idx}`).textContent = 'Reanudar';
    document.getElementById(`tlabel-${idx}`).textContent = 'Pausado';
  } else {
    // Start / Resume
    if (t.remaining <= 0) { timerReset(idx); return; }
    t.running = true;
    document.getElementById(`tbtn-${idx}`).textContent = 'Pausar';
    document.getElementById(`tlabel-${idx}`).textContent = 'Descansando...';
    t.interval = setInterval(() => {
      t.remaining--;
      updateTimerUI(idx);
      if (t.remaining <= 0) {
        clearInterval(t.interval);
        t.running = false;
        timerFinished(idx);
      }
    }, 1000);
  }
}

function timerReset(idx) {
  const t = getTimer(idx);
  clearInterval(t.interval);
  t.running = false;
  t.remaining = TIMER_DURATION;
  updateTimerUI(idx);
  const btn = document.getElementById(`tbtn-${idx}`);
  if (btn) {
    btn.textContent = 'Iniciar';
    btn.className = 'timer-btn primary';
  }
  const lbl = document.getElementById(`tlabel-${idx}`);
  if (lbl) lbl.textContent = 'Descanso';
  const ring = document.getElementById(`ring-${idx}`);
  if (ring) { ring.className = 'timer-ring-fill'; }
}

function updateTimerUI(idx) {
  const t = getTimer(idx);
  const m = Math.floor(t.remaining / 60);
  const s = t.remaining % 60;
  const display = `${m}:${s.toString().padStart(2, '0')}`;
  const numEl = document.getElementById(`tnum-${idx}`);
  if (numEl) numEl.textContent = display;

  // Ring progress
  const circumference = 113;
  const offset = circumference - (t.remaining / TIMER_DURATION) * circumference;
  const ring = document.getElementById(`ring-${idx}`);
  if (ring) {
    ring.style.strokeDashoffset = offset;
    ring.className = 'timer-ring-fill' +
      (t.remaining <= 30 ? ' urgent' : t.remaining <= 60 ? ' warning' : '');
  }
}

function timerFinished(idx) {
  // Vibrate if supported
  if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
  const lbl = document.getElementById(`tlabel-${idx}`);
  if (lbl) lbl.innerHTML = '<span class="timer-done-msg">¡A la siguiente! 💪</span>';
  const btn = document.getElementById(`tbtn-${idx}`);
  if (btn) { btn.textContent = 'Repetir'; btn.className = 'timer-btn'; }
  const numEl = document.getElementById(`tnum-${idx}`);
  if (numEl) numEl.textContent = '0:00';
}

function openNutrition() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('nutrition-panel').classList.add('open');
}

function closeNutrition() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('nutrition-panel').classList.remove('open');
}

// Touch to close panel
let startY = 0;
document.getElementById('nutrition-panel').addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
});
document.getElementById('nutrition-panel').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - startY > 60) closeNutrition();
});

// Init
buildTabs();
renderDay();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
